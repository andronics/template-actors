# Template-owned: template-actors. The PR contract's merge policy (decision 0001): on a PR an
# actor opened from its own branch in this repository, queue auto-merge when its manifest
# (.github/actors/<slug>.yml) says auto-on-ci or auto-after-codeowner, and add its labels. The
# actor is found by its bot login (<app>[bot]) and branch prefix, from
# the manifests on the base branch, never the PR's. It never approves: the main ruleset decides
# what a merge needs (the required `ci` check; for auto-after-codeowner, a code owner's review).
# A local actor queues its own (scripts/actors-cron.sh); Dependabot's is template-base's. Needs
# the repository setting "Allow auto-merge".
name: Actor auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  automerge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && endsWith(github.event.pull_request.user.login, '[bot]')
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The base branch's manifests: a PR can't grant itself a merge policy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: actor
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: uv run --quiet scripts/actors.py automerge --author "$AUTHOR" --head-ref "$HEAD_REF" >> "$GITHUB_OUTPUT"
      # TODO(template-base app-token): queue the merge with a token from template-base's
      # .github/actions/app-token composite action (andronics/template-base, in review) instead of
      # GITHUB_TOKEN. A merge that GITHUB_TOKEN queued starts no workflow on main (release-please,
      # for one), as with template-base's Dependabot auto-merge. Don't add a mint step here.
      - name: Add the actor's labels
        if: steps.actor.outputs.labels != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          LABELS: ${{ steps.actor.outputs.labels }}
        run: gh pr edit "$PR" --add-label "$LABELS"
      - name: Queue auto-merge
        if: steps.actor.outputs.merge != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          METHOD: ${{ steps.actor.outputs.merge }}
        run: gh pr merge "$PR" --auto "--$METHOD"
